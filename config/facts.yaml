# External facts the matcher may apply (FR-10, D-021, D-066). Loaded by
# internal/facts from FACTS_FILE (default config/facts.yaml).
#
# Each fact: id (snake_case, the key shown in a relationship's facts_used),
# value (a literal string in the unit the notes name; quote numbers so the
# file text is what is stored), source (absolute http(s) URL the value was
# read from), as_of (calendar date, UTC, not in the future), notes (optional).
#
# Changing a value is a reviewed change to this file: a new fact value gets a
# new as_of and a new source. Never guess a value; if it is unknown, leave the
# fact out and the matcher will not apply it.
facts:
  # Fed demo fact (docs/plan.md M2, domain.md equivalent_given_facts).
  # Upper bound of the federal funds target range in percent, as set at the
  # FOMC meeting of September 15-16, 2026 (raised 1/4 point to 3.75-4.00 %,
  # effective September 17, 2026). This is the level "prior to the October
  # 27-28, 2026 meeting" that Polymarket's "Fed Decision in October?" markets
  # measure changes against, so "increase 25 bps after the October 2026
  # meeting" is "upper bound above 4.00 % following the Oct 28, 2026 meeting"
  # (Kalshi KXFED-26OCT-T4.00) given this fact.
  - id: fed_upper_bound
    value: "4.00"
    source: https://www.federalreserve.gov/newsevents/pressreleases/monetary20260916a.htm
    as_of: 2026-09-16
    notes: >-
      Percent. Target range 3.75-4.00 % after the September 16, 2026 FOMC
      decision (+25 bps, effective September 17, 2026). Valid until the
      October 28, 2026 decision; update value, source and as_of after it.

  # Which FOMC decision fed_upper_bound is the level before (internal/match
  # facts.go, M2-04). The matcher applies fed_upper_bound only to pairs whose
  # deadlines sit on this meeting day: a later meeting's change bucket depends
  # on this meeting's decision and stays `related`. Decision day of the
  # October 27-28, 2026 meeting per the official calendar. Update together
  # with fed_upper_bound after each decision.
  - id: fed_next_meeting
    value: "2026-10-28"
    source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    as_of: 2026-10-06
    notes: >-
      Calendar date (UTC) of the FOMC decision that fed_upper_bound precedes.
      The two-day meeting is October 27-28, 2026; the statement is released
      on the second day.

  # The grid the upper bound moves on, in percentage points (M2-04). Every
  # change to the target range since December 2008 has been a whole number of
  # 25 bps steps and the range is 25 bps wide, so a level ladder "above 4.00"
  # and a change bucket "at least +25 bps" (at or above 4.25) are the same
  # set of reachable outcomes. The matcher uses it only to close open ends on
  # the grid; off-grid moves are scored as basis risk (grid_rounding).
  - id: fed_rate_step
    value: "0.25"
    source: https://www.federalreserve.gov/monetarypolicy/openmarket.htm
    as_of: 2026-10-06
    notes: >-
      Percentage points. Read from the "Open Market Operations" history of
      target range changes; every entry is a multiple of 0.25.

  # Decision days of the scheduled FOMC meetings that the golden-set Fed pairs
  # rely on (D-083, Paawan 2026-10-07 9:30 PM CT). Kalshi KXFEDDECISION and
  # Polymarket "Fed Decision in <month>?" pay the same only if each meeting
  # is held on its scheduled date: a meeting moved off its date resolves
  # "Fed maintains rate" on Kalshi but waits for the statement on Polymarket.
  # Those pairs are therefore labelled equivalent_given_facts with this fact
  # and fed_rate_step. Record-only: the matcher does not read this id yet.
  - id: fed_meeting_dates
    value: "2026-10-28,2026-12-09,2027-01-27"
    source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    as_of: 2026-10-07
    notes: >-
      Comma-separated calendar dates (UTC) of the second day of the October
      27-28, 2026, December 8-9, 2026 and January 26-27, 2027 FOMC meetings,
      as scheduled on the official calendar. If a meeting is cancelled or
      moved, update this fact and revisit the golden labels that cite it.
