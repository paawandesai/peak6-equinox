    a_title: "Will the Federal Reserve Cut rates by >25bps at their October 2026 meeting? — Cut >25bps"
    b_title: "Will the Fed decrease interest rates by 50+ bps after the October 2026 meeting?"
    category: fed
    suggested_by_matcher: not_drafted
    proposed_label: equivalent_given_facts
    why: "Same proposition: the change the FOMC decides at the Oct 27-28, 2026 meeting, in the same bucket. Kalshi KXFEDDECISION-26OCT-C26 (Cut >25bps): FEDDECISION terms, source federalreserve.gov, expires 2:05 PM ET after the decision. Polymarket: change in the upper bound vs the pre-meeting level, off-grid changes rounded up to the next 25 bps, source the FOMC statement. Bucket map: Kalshi 'Cut >25bps' = PM '50+ bps decrease', 'Cut 25bps' = '25 bps decrease', 'maintains' = 'No change', 'Hike 25bps' = '25 bps increase', 'Hike >25bps' = '50+ bps increase'. Deadlines are under 10 h apart on the same day. Labelled equivalent_given_facts per D-083 (Paawan, 2026-10-07 9:30 PM CT): the payouts match whenever the facts hold. Facts relied on: fed_meeting_dates (the meeting is held on its scheduled FOMC-calendar date, config/facts.yaml) and fed_rate_step=0.25 (the Fed moves in 25 bp steps, config/facts.yaml). Where they could diverge if a fact fails: (1) a meeting moved off its scheduled date: Kalshi's rules_secondary resolves 'Fed maintains rate' YES, while PM waits for a statement until the end of the next scheduled meeting and resolves on it; (2) an off-grid move such as 12.5 bps: PM rounds up to the 25 bps bucket, Kalshi's terms do not say."
    rules_checked: "Kalshi KXFEDDECISION-26OCT-C26 rules_primary/rules_secondary + series contract terms; Polymarket Gamma market 2589810 description; fetched 2026-10-07. Kalshi rules: If the Federal Reserve does a Cut of [>]25bps (the API text drops the > sign; yes_sub_title and rules_secondary give >25bps) on October 28, 2026, then the market resolves to Yes."
    review_status: pending_human

